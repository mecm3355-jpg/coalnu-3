<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="간단한 할 일 앱" />
    <title>할 일 앱</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css?v=20261013-auth" />
    <script src="script.js?v=20261013-auth" defer></script>
  </head>
  <body>
    <section class="auth-page" id="auth-view" aria-labelledby="auth-title">
      <div class="auth-card">
        <div class="auth-brand">
          <p class="eyebrow">DAILY PLANNER</p>
          <h1 id="auth-title">오늘의 할 일</h1>
          <p>나만의 일정과 기록을 안전하게 관리하세요.</p>
        </div>

        <div class="auth-tabs" role="tablist" aria-label="회원 메뉴">
          <button type="button" class="auth-tab active" data-auth-mode="login" role="tab" aria-selected="true">
            로그인
          </button>
          <button type="button" class="auth-tab" data-auth-mode="register" role="tab" aria-selected="false">
            회원가입
          </button>
        </div>

        <form class="auth-form" id="auth-form">
          <label id="auth-name-field" for="auth-name" hidden>
            <span>이름</span>
            <input id="auth-name" type="text" autocomplete="name" minlength="2" maxlength="30" placeholder="이름을 입력해 주세요" />
          </label>
          <label for="auth-email">
            <span>이메일</span>
            <input id="auth-email" type="email" autocomplete="email" placeholder="email@example.com" required />
          </label>
          <label for="auth-password">
            <span>비밀번호</span>
            <input id="auth-password" type="password" autocomplete="current-password" minlength="8" maxlength="72" placeholder="8자 이상 입력해 주세요" required />
          </label>
          <label id="auth-password-confirm-field" for="auth-password-confirm" hidden>
            <span>비밀번호 확인</span>
            <input id="auth-password-confirm" type="password" autocomplete="new-password" minlength="8" maxlength="72" placeholder="비밀번호를 다시 입력해 주세요" />
          </label>
          <p class="auth-error" id="auth-status" role="alert" hidden></p>
          <button type="submit" class="auth-submit" id="auth-submit">로그인</button>
        </form>
        <p class="auth-help">
          <span id="auth-help-text">계정이 없으신가요?</span>
          <button type="button" id="auth-help-button">회원가입</button>
        </p>
      </div>
    </section>

    <main class="todo-app" id="todo-app" hidden>
      <header class="app-header">
        <div>
          <p class="eyebrow">DAILY PLANNER</p>
          <h1>오늘의 할 일</h1>
          <p class="subtitle">중요한 일부터 차근차근 완료해 보세요.</p>
        </div>
        <div class="header-account">
          <time class="today" id="today-date"></time>
          <div class="account-actions">
            <span class="user-name"><strong id="account-name"></strong>님</span>
            <button type="button" class="account-button" id="logout-button">로그아웃</button>
            <button type="button" class="account-button danger" id="delete-account-button">회원탈퇴</button>
          </div>
        </div>
      </header>

      <div class="connection-banner" id="connection-banner" role="alert" hidden>
        <span>백엔드 서버와 연결이 끊겼습니다.</span>
        <button type="button" id="connection-retry-button">다시 연결</button>
      </div>

      <section class="composer" aria-labelledby="composer-title">
        <div class="section-heading">
          <div>
            <p class="section-label">새로운 일정</p>
            <h2 id="composer-title">무엇을 해야 하나요?</h2>
          </div>
        </div>

        <form class="todo-form" id="todo-form">
          <label class="task-field" for="todo-input">
            <span>할 일</span>
            <input
              id="todo-input"
              type="text"
              placeholder="예: 발표 자료 마무리하기"
              autocomplete="off"
              maxlength="200"
              required
            />
          </label>

          <div class="form-options">
            <label for="deadline-input">
              <span>마감기한 <strong class="optional-label">선택</strong></span>
              <input id="deadline-input" type="datetime-local" />
            </label>

            <label for="priority-input">
              <span>우선순위 <strong class="optional-label">선택</strong></span>
              <select id="priority-input">
                <option value="" selected>선택 안 함</option>
                <option value="high">높음</option>
                <option value="medium">보통</option>
                <option value="low">낮음</option>
              </select>
            </label>
          </div>

          <button type="submit" class="add-button">
            <span aria-hidden="true">＋</span>
            <span id="add-label">할 일 추가</span>
          </button>
        </form>
      </section>

      <section class="list-section" aria-labelledby="list-title">
        <div class="list-header">
          <div class="list-title-group">
            <h2 id="list-title">할 일 목록</h2>
            <p class="list-help">체크하면 완료로 표시됩니다.</p>
          </div>
          <div class="summary" aria-label="할 일 요약">
            <time class="last-sync" id="last-sync">업데이트 전</time>
            <button type="button" class="sync-button" id="sync-button">
              <span class="sync-icon" aria-hidden="true">↻</span>
              <span id="sync-label">새로고침</span>
            </button>
          </div>
        </div>

        <div class="filter-tabs" role="group" aria-label="할 일 필터">
          <button type="button" class="filter-button active" data-filter="all" aria-pressed="true">
            전체 <span class="filter-count" id="all-filter-count">0</span>
          </button>
          <button type="button" class="filter-button" data-filter="active" aria-pressed="false">
            진행 중 <span class="filter-count" id="active-filter-count">0</span>
          </button>
          <button type="button" class="filter-button" data-filter="completed" aria-pressed="false">
            완료 <span class="filter-count" id="completed-filter-count">0</span>
          </button>
          <button type="button" class="clear-completed-button" id="clear-completed-button" hidden>
            완료 항목 삭제
          </button>
        </div>

        <div class="deadline-summary" id="deadline-summary" role="group" aria-label="마감기한 필터" hidden>
          <button type="button" class="deadline-summary-button overdue-summary" data-deadline-filter="overdue" aria-pressed="false">
            기한 초과 <strong id="overdue-count">0</strong>개
          </button>
          <button type="button" class="deadline-summary-button today-summary" data-deadline-filter="today" aria-pressed="false">
            오늘 마감 <strong id="today-due-count">0</strong>개
          </button>
        </div>

        <div class="list-tools">
          <div class="search-field">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <label class="sr-only" for="search-input">할 일 검색</label>
            <input id="search-input" type="search" placeholder="할 일 검색" autocomplete="off" />
            <button type="button" class="search-clear-button" id="search-clear-button" aria-label="검색어 지우기" hidden>
              지우기
            </button>
          </div>
          <label class="sort-field" for="sort-select">
            <span>정렬</span>
            <select id="sort-select" autocomplete="off">
              <option value="recommended">추천순</option>
              <option value="deadline">마감순</option>
              <option value="priority">우선순위순</option>
              <option value="newest">최신순</option>
            </select>
          </label>
        </div>

        <p class="status loading" id="status" role="status">할 일을 불러오는 중...</p>
        <ul class="todo-list" id="todo-list"></ul>
      </section>
    </main>

    <div class="undo-toast" id="undo-toast" role="status" aria-live="polite" hidden>
      <span id="undo-message"></span>
      <button type="button" id="undo-button">실행 취소</button>
    </div>
  </body>
</html>
